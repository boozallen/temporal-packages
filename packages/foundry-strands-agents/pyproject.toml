[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry-strands-agents"
version = "0.8.1"
license = "Apache-2.0"
license-files = ["LICENSE*", "NOTICE*"]
description = "Foundry Strands Agents - Temporal integration for Strands agents"
requires-python = ">=3.14,<3.16"

dependencies = [
    "temporalio>=1.21.1,<2",
    "aiohttp>=3.14.1,<4",
    "pydantic>=2.12.5,<3",
    "foundry-temporal",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_strands_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers --strict-config --import-mode=importlib --cov=src/foundry_strands_agents --cov-report=term-missing --cov-report=html:htmlcov/foundry_strands_agents --cov-fail-under=70"
markers = [
    "unit: unit tests (fast, no external services or credentials required)",
    "integration: integration tests (may require external services or credentials)",
    "slow: tests that may take longer to run",
    "network: tests that require network access",
    "temporal: tests that interact with Temporal services",
    "aws: tests that interact with AWS services",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*datetime.*:DeprecationWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/foundry_strands_agents"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]